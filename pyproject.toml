[project]
name = "lima-ai"
version = "0.5.0"
description = "Disposable Lima VMs for running Claude Code agents in parallel, one workspace per VM"
readme = "README.md"
authors = [
    { name = "Jon Trigueiro", email = "joepreludian@gmail.com" }
]
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["lima", "claude", "claude-code", "vm", "docker", "macos", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: System :: Emulators",
]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
]

[project.scripts]
lima-ai = "lima_ai.cli:main"

[project.urls]
Homepage = "https://github.com/joepreludian/lima-ai"
Documentation = "https://lima-ai.readthedocs.io/"
Changelog = "https://github.com/joepreludian/lima-ai/releases"

[dependency-groups]
dev = [
    "pex>=2.40",
    "pytest>=8",
    "pyyaml>=6",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not lima'"
markers = [
    "lima: integration tests that build real Lima VMs (slow, opt-in: pytest -m lima)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
